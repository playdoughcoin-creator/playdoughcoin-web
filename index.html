<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PlayDoughCoin - The Future of Digital Currency">
    <meta name="keywords" content="PlayDoughCoin, cryptocurrency, digital currency, blockchain">
    <meta name="author" content="PlayDoughCoin Team">
    <link rel="icon" href="favicon.ico" sizes="any">
    <title>PlayDoughCoin - The Future of Digital Currency</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; }
        header { background: #0078d4; color: #fff; padding: 10px; text-align: center; }
        h1 { margin: 0; }
        .signup-form { margin: 20px; padding: 20px; background: #fff; border-radius: 8px; }
        input[type="email"] { width: calc(100% - 22px); padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        input[type="submit"] { background: #0078d4; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; }
        input[type="submit"]:hover { background: #005ba1; }
        footer { text-align: center; padding: 10px; background: #0078d4; color: white; }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to PlayDoughCoin</h1>
    </header>
    <main>
        <section class="signup-form">
            <h2>Join Our Community</h2>
            <form action="#" method="post">
                <label for="email">Enter your email:</label>
                <input type="email" id="email" name="email" required aria-required="true">
                <input type="submit" value="Sign Up">
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 PlayDoughCoin. All rights reserved.</p>
    </footer>
</body>
</html>
